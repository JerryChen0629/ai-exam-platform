<style>

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f6f8;color:#1f2328}
.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 24px 0}

h1{font-size:20px;margin:0 0 4px;letter-spacing:.3px}
.sub{color:#8b8f96;font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px}
.tab{padding:10px 20px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;color:#4b5563;border:1px solid transparent;border-bottom:none;position:relative;top:1px;user-select:none}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

.btn.on{background:#2563eb;border-color:#2563eb;color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;margin-bottom:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.no{font-size:12.5px;color:#9ca3af;font-variant-numeric:tabular-nums;min-width:26px}
.src{font-size:11px;color:#6b7280;background:#f3f4f6;border-radius:4px;padding:2px 7px}
.badge{font-size:11px;border-radius:4px;padding:2px 7px;background:#eff6ff;color:#1d4ed8}
.badge.m{background:#f5f3ff;color:#6d28d9}
.badge.j{background:#ecfdf5;color:#047857}
.badge.e{background:#fff7ed;color:#c2410c}
.fstar{font-size:11px;border-radius:4px;padding:2px 7px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;font-weight:600}
.q{font-size:14.5px;line-height:1.65;color:#111827;margin:2px 0 10px}
.eyebtn{display:inline-block;font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:3px 9px;cursor:pointer;user-select:none;margin:-4px 0 10px}
.eyebtn:hover{background:#fef3c7}
.eye{display:none;font-size:13px;line-height:1.6;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:8px 12px;margin:0 0 10px}
.eye.show{display:block}
.eye .lbl{font-weight:600;margin-right:6px}
body.drill .opts,body.drill .ans,body.drill .exp,body.drill .reveal,body.drill .eyebtn{display:none}
body.drill .card{cursor:pointer}
body.drill .card.open .opts,body.drill .card.open .exp{display:block}
body.drill .card.open .ans{display:block}
body.drill .card.open .eye{display:block}
body.drill .card.open .eyebtn{display:none}
body.noans .opt.ok{background:transparent;color:#374151}
body.noans .opt.ok .k{color:#9ca3af}
body.noans .ansbox,body.noans .reveal{display:none}
body.noans .card{cursor:pointer}
body.noans .card.open .ansbox{display:block}
body.noans .card.open .reveal{display:none}
body.noans .card.open .ans{display:block}
body.noans .card.open .opt.ok{background:#eefbf1;color:#15803d}
body.noans .card.open .opt.ok .k{color:#16a34a}
body.practice .reveal{display:none}
.flipbtn{display:none}
body.drill .flipbtn,body.noans .flipbtn{display:inline-block;font-size:12.5px;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:6px 14px;cursor:pointer;user-select:none;margin:0 0 10px}
body.drill .card.open .flipbtn,body.noans .card.open .flipbtn{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb}
.drillhint{display:none;font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:12px}
body.drill .drillhint,body.noans .drillhint{display:block}
body.practice .opt{cursor:pointer}
body.practice .card:not(.done) .opt.ok{background:transparent;color:#374151}
body.practice .card:not(.done) .opt.ok .k{color:#9ca3af}
body.practice .opt.sel{background:#eff6ff;border:1px solid #bfdbfe}
body.practice .opt.right{background:#eefbf1;color:#15803d}
body.practice .opt.right .k{color:#16a34a}
body.practice .opt.no{background:#fef2f2;color:#b91c1c}
body.practice .opt.no .k{color:#dc2626}
body.practice .card.done .opts,body.practice .card.done .submitbtn,body.practice .card.done .essayjudge{pointer-events:none;opacity:.95}
.verdict{display:none;margin:8px 0;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;line-height:1.6}
.verdict.show{display:block}
.verdict.ok{color:#166534;background:#f2fbf5;border:1px solid #c6ebd3}
.verdict.no{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca}
.submitbtn{display:none}
body.practice .submitbtn{display:inline-block;margin:6px 0 4px;font-size:12.5px;color:#fff;background:#2563eb;border:none;border-radius:6px;padding:7px 16px;cursor:pointer}
body.practice .submitbtn:disabled{background:#cbd5e1;cursor:default}
.essayjudge{display:none;margin-top:8px;gap:8px}
body.practice .essayjudge{display:flex}
.essayjudge .ej{font-size:12.5px;padding:6px 14px;border-radius:6px;cursor:pointer;border:1px solid #dcdfe4;background:#fff}
.essayjudge .ej.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.essayjudge .ej.no{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.opts{margin:0 0 4px}
.opt{display:flex;gap:9px;font-size:13.5px;line-height:1.6;color:#374151;padding:4px 8px;border-radius:6px}
.opt .k{color:#9ca3af;font-weight:600;min-width:14px}
.opt.ok{background:#eefbf1;color:#15803d}
.opt.ok .k{color:#16a34a}
.ansbox{margin-top:10px;border-top:1px dashed #e5e7eb;padding-top:10px}
.reveal{font-size:12.5px;color:#6b7280;cursor:pointer;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:6px;padding:6px 12px;display:inline-block;user-select:none}
.reveal:hover{background:#eef2f7}
.ans{display:none;margin-top:8px;font-size:13px;line-height:1.65;color:#15803d;background:#f2fbf5;border:1px solid #c6ebd3;border-radius:8px;padding:9px 12px}
.ans.show{display:block}
.ans b{color:#166534}
.exp{margin-top:8px;font-size:12.5px;line-height:1.65;color:#6b7280;background:#fafbfc;border-left:3px solid #dcdfe4;border-radius:0 6px 6px 0;padding:8px 12px}
.exp .lbl{color:#b45309;font-weight:600;margin-right:4px}
.ep{margin-top:8px}
.ep .h{font-size:13px;font-weight:600;color:#374151;margin:10px 0 4px}
.ep .c{font-size:13px;line-height:1.75;color:#4b5563}

.epfull .fulldl{font-size:12.5px;color:#2563eb;cursor:pointer;user-select:none;font-weight:600}
.epfull .fulldl:hover{text-decoration:underline}

.epfull.open .fullbox{display:block}
.epfull.open .fulldl::before{content:"▲ ";color:#94a3b8}
.epfull .fullbox .h{font-size:12.5px;font-weight:600;color:#475569;margin:8px 0 3px}
.epfull .fullbox .h:first-child{margin-top:0}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pg{min-width:32px;height:32px;padding:0 9px;border:1px solid #dcdfe4;background:#fff;border-radius:7px;font-size:12.5px;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pg:hover{background:#f3f4f6}
.pg.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.pg.dis{opacity:.4;cursor:default}
.pginfo{font-size:12px;color:#8b8f96;margin-left:8px}
.empty{text-align:center;color:#9ca3af;font-size:13px;padding:40px}

}

显优化是文本纠错pipeline中不重要的一部分。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"ASR 回显优化很重要"},{"type":"judge","n":34,"src":"试卷3","title":"句子对齐是自然语言处理中的一个任务，其目标是找出两段文本中相似或等价的部分。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"句子对齐找等价片段"},{"type":"judge","n":35,"src":"试卷3","title":"生成式问答系统是通过生成完整的答案，而不是从候选答案中选择，来回答问题的。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"生成式问答是写不是选","focus":true},{"type":"judge","n":36,"src":"试卷3","title":"在自然语言处理中，神经网络机器翻译依赖于大量的标注数据进行训练。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"神经翻译吃大量标注"},{"type":"judge","n":37,"src":"试卷3","title":"在自然语言处理任务中，注意力机制无法解决长序列信息的获取问题。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"注意力正是治长序列的"},{"type":"judge","n":38,"src":"试卷3","title":"长短期记忆（LSTM）网络属于深度学习模型。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"LSTM 属深度学习","focus":true},{"type":"judge","n":39,"src":"试卷3","title":"BERT模型只可以应用于自然语言处理任务。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"BERT 不止能做 NLP"},{"type":"judge","n":40,"src":"试卷3","title":"长短期记忆（LSTM）网络在处理语音识别、自然语言处理等序列预测任务中具有优秀的性能。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"LSTM 擅长序列预测"},{"type":"judge","n":41,"src":"试卷3","title":"在特征提取阶段，一定要选择词向量而不能选择字向量。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"字向量也能做特征"},{"type":"judge","n":42,"src":"试卷3","title":"对于嵌套命名实体识别问题，我们没有有效的方法来处理。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"嵌套实体有办法处理"},{"type":"judge","n":43,"src":"试卷3","title":"在命名实体识别任务中，标注数据不均衡对模型的影响较小，可以忽略不计。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"标注不均衡影响很大"},{"type":"judge","n":44,"src":"试卷3","title":"Self-Attention是一种处理自然语言处理任务的注意力机制，所有输入都被其他所有输入模态化。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"自注意力让输入互相作用"},{"type":"judge","n":45,"src":"试卷3","title":"知识图谱是一种新的数据组织和管理方式。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"图谱是新的数据组织方式","focus":true},{"type":"judge","n":46,"src":"试卷3","title":"随机场主要用于表述一组随机变量之间的关系。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"随机场描述变量间关系"},{"type":"judge","n":47,"src":"试卷3","title":"分词是自然语言处理的最基础任务。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"A","mine":"A","wrong":false,"exp":"","eye":"分词是 NLP 最底层"},{"type":"judge","n":48,"src":"试卷3","title":"词性标注只能基于统计方法进行。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"词性标注不止统计一招"},{"type":"judge","n":49,"src":"试卷3","title":"文本情感分析不能帮助企业理解消费者对其产品的感受。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"情感分析能帮企业读懂用户","focus":true},{"type":"judge","n":50,"src":"试卷3","title":"机器翻译技术的发展已经达到了与人类翻译家同等水平。","opts":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"right":"B","mine":"B","wrong":false,"exp":"","eye":"机翻还没追上人类译员","focus":true},{"type":"essay","n":1,"src":"工程实践1","code":"工程实践 B1","score":"5 分","title":"某公司客服每天收到大量重复咨询，客服人员疲于应对，回复口径也不统一。公司希望借助大模型做一个智能客服助手，先在内部试用。请结合上述场景，说明你会如何推进这项工作，包括开展步骤、需要准备的材料，以及如何判断这个助手是否达到可用状态。","points":[{"h":"(1) 开展步骤","c":"梳理高频问题定首版范围→整理标准答复口径（须与客服主管确认，解决口径不一）→编写指令让模型基于给定材料作答→内部试用、收集问题再调整。"},{"h":"(2) 需要准备的材料","c":"四类：**高频问答清单**（最核心）、产品服务与收费标准文档、真实历史咨询记录（测试用）、答复边界清单（价格/退款/投诉等须转人工）。"},{"h":"(3) 判断是否达到可用状态","c":"用真实样例测正确率、核对口径是否一致、查有无编造；重点验证**不会的题能否如实转人工**（比答对率更关键）；再让客服实际试用确认。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"智能客服：知识库加人工兜底","full":[{"h":"(1) 开展步骤","c":"我会先从最常见的问题入手，不一开始就想做全。第一步梳理客服的历史咨询记录，统计出现频率最高的问题，选十到二十个高频问题作为第一版范围。第二步整理每个问题的标准答复口径，这一步要和客服主管确认，因为现在的问题恰恰是口径不统一，不能把不一致的说法直接喂给模型。第三步编写指令，把整理好的问答资料随问题一起提供给模型，让它基于给定材料回答而不是自由发挥。第四步先在内部试用，让客服人员自己提问、自己判断答复是否可用，收集问题后再调整。"},{"h":"(2) 需要准备的材料","c":"主要是四类：一是高频问题与标准答复清单，这是最核心的；二是产品资料、服务说明、收费标准等参考文档；三是一批真实的历史咨询记录，用来测试效果；四是明确的答复边界清单，写清哪些问题不能由助手回答，比如涉及价格优惠、退款、投诉处理这类需要人工判断的，必须转人工。"},{"h":"(3) 判断是否达到可用状态","c":"不能凭感觉说差不多能用了。我会拿真实咨询样例测一批，统计答复正确的比例，并逐条核对答复口径是否与标准一致、有没有编造的信息。特别要验证遇到不会的问题时，助手能否如实说明并转人工，而不是硬编一个答案——这一点比答对率更重要，因为编造的答复会直接影响客户。最后请客服人员实际试用几天，由他们确认是否愿意用。上线后还要持续收集答错的案例，定期补充问答资料。"}]},{"type":"essay","n":2,"src":"工程实践2","code":"工程实践 B1","score":"5 分","title":"某电商团队每天需要为新上架的商品撰写介绍文案，人工撰写耗时且风格不统一。团队希望用大模型批量生成初稿，再由人工修改定稿。请结合上述场景，说明你会如何设计这项工作的流程，需要注意哪些问题，以及如何保证生成内容可用。","points":[{"h":"(1) 工作流程","c":"整理商品基础信息（名称/规格/卖点/人群）作输入→编写统一指令模板固定结构与风格→附几篇优质文案作示例→批量生成初稿、编辑逐篇修改定稿。"},{"h":"(2) 需要注意的问题","c":"**禁止编造参数/功效/资质**（指令写明只用提供的参数）；避免“最好/第一”等绝对化用语（法律风险）；保持品牌风格统一；先小批量试跑再放量。"},{"h":"(3) 保证内容可用","c":"逐篇人工核对三处——参数是否一致、有无违规用语、有无编造；整理检查清单逐项过；抽查给业务方确认风格；同类问题反复出现就回去改指令或补示例。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"批量文案：模板变量加示例","full":[{"h":"(1) 工作流程","c":"整体思路是模型出初稿、人工定稿，不指望一步到位。第一步整理商品基础信息作为输入，包括名称、规格参数、核心卖点、适用人群，信息越具体，生成的文案越少空话。第二步编写统一的指令模板，固定文案的结构与风格，比如都按标题、亮点、适用场景三段来写。第三步挑几篇现有的优质文案作为示例附在指令里，让模型有个对标对象。第四步批量生成初稿，再由编辑逐篇修改定稿。"},{"h":"(2) 需要注意的问题","c":"最要紧的是不能让模型编造商品参数、功效或资质信息。模型很容易顺着语气写出国家认证、销量第一这类内容，而这些既不真实也涉及违规。所以指令里要明确写出只能使用我提供的参数，不确定的一律不写。其次要避免绝对化用语，比如最好、第一、百分百有效，这类表述有法律风险。另外要保持品牌风格统一，不能不同商品文案风格差异过大。最后先小批量试跑，确认效果再放量。"},{"h":"(3) 保证内容可用","c":"生成后必须逐篇人工核对，重点核对三处：参数与商品实际信息是否一致、有没有违规用语、有没有编造的内容。可以整理一份检查清单，编辑照着逐项过一遍，避免漏检。同时抽查几篇给业务方看，确认风格符合预期。发现某类问题反复出现，就回去改指令或补充示例，而不是每次都靠人工挑错。"}]},{"type":"essay","n":3,"src":"技术技能1","code":"技术技能 A1","score":"8 分","title":"你需要让大模型帮你把一段客户咨询记录整理成结构化的信息表。请说明：（1）你会如何编写指令，让输出结果稳定、格式一致；（2）你会怎样检查输出结果是否可用。","points":[{"h":"(1) 指令编写","c":"分四段写：①交代角色与任务；②明确列出要提取的字段（姓名/联系方式/咨询内容/意向程度）；③指定输出格式（固定键值对、每字段一行）；④附1-2个填好示例（比文字描述更有效）。并写明**缺失信息填“未提供”、禁止自行推测**。"},{"h":"(2) 结果检查","c":"先查格式（字段齐全、格式一致）；再查内容（逐条对照原文、确认无编造）；换多条不同风格记录测**稳定性**（单条成功≠批量可用）；问题反复出现就补判断标准或加示例。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"结构化抽取：定字段给示例要JSON","full":[{"h":"(1) 指令编写","c":"我会把指令写成四段。先交代角色和任务，比如你是客服助理，请从下面的咨询记录中提取信息，让模型知道自己在做什么。然后明确列出要提取的字段：客户姓名、联系方式、咨询内容、意向程度，字段不列清楚模型就会自己发挥。接着指定输出格式，要求按固定的键值对形式返回，每个字段一行。最后附一到两个填好的示例，让模型照着格式输出，这比只用文字描述格式有效得多。另外要写明遇到记录里没有的信息就填未提供，明确禁止自行推测补充。"},{"h":"(2) 结果检查","c":"先看格式：字段是否齐全、有没有多出或少掉的字段、格式是否与要求一致。再看内容：逐条对照原始记录，确认提取的信息确实来自原文，特别注意有没有模型自己编出来的联系方式或需求描述。然后换几条不同风格的记录再试一遍，看输出是否稳定——单条成功不代表批量可用。如果发现某类问题反复出现，比如意向程度判断不准，就回去补充判断标准或增加示例，而不是每次靠人工改。"}]},{"type":"essay","n":4,"src":"技术技能1","code":"技术技能 A2","score":"8 分","title":"同事写的指令是帮我写一下产品介绍，模型给出的内容不符合预期。请说明：（1）这条指令存在哪些问题；（2）你会如何改写，改写后包含哪些要素。","points":[{"h":"(1) 存在的问题","c":"五个缺失：没说**产品是什么**、没说**写给谁看**、没说**用途与篇幅**、无格式与风格要求、无参考示例。五点全缺等于让模型自由创作，输出必然偏离。"},{"h":"(2) 改写要素","c":"补齐产品名称/功能/卖点；说明读者、场合、字数、语气；指定输出结构（标题+亮点+场景）；附同类优质范例；并明确**只用提供的信息、不确定参数不写**（防模型编数据），生成后须人工核对事实。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"指令四要素：角色任务约束示例","full":[{"h":"(1) 存在的问题","c":"这条指令几乎没提供任何有效信息。首先没说产品是什么，模型只能凭空猜测，写出来的内容必然是空话。其次没说写给谁看，面向客户的宣传文案和面向内部的说明文档写法完全不同。第三没说用途与篇幅，是发朋友圈还是放官网、要三百字还是三千字，输出形态完全不可控。第四没有格式与风格要求。第五没给参考示例，模型没有对标对象。这五点缺一个都会让输出偏离预期，全都缺就等于让模型自由创作。"},{"h":"(2) 改写要素","c":"我会补齐这几项：交代产品名称、主要功能和核心卖点，这是最基本的输入；说明读者是谁、用在什么场合、期望多少字、语气偏正式还是轻松；指定输出结构，比如分成标题、三个亮点、适用场景三部分；附一篇同类产品的优质文案作为范例。还有一条容易被忽略：要明确写出只能使用我提供的产品信息，不确定的参数一律不写。因为模型很容易顺着语气编出具体数据或荣誉，生成后必须人工核对事实，不能直接采用。"}]},{"type":"essay","n":5,"src":"技术技能1","code":"技术技能 A3","score":"9 分","title":"你要向业务方演示一个大模型应用的效果，业务方关心到底准不准。请说明：（1）你会如何准备演示与评估材料；（2）如果效果不理想，你会从哪些方面改进；（3）向业务方说明效果时，你会如何交代该应用的能力边界。","points":[{"h":"(1) 准备演示与评估材料","c":"准备一批**真实业务测试样例**覆盖常见情况；事先与业务方确认“什么算正确”（否则双方理解不一致）；统计正确比例用数据说话；保留失败案例、主动说明局限。"},{"h":"(2) 改进方向","c":"按成本从低到高：先**改指令**（更明确+补示例，最快最有效）→补充资料（随问题提供文档）→换更强模型（评估成本）→拆分任务分步处理。"},{"h":"(3) 交代能力边界","c":"如实说明正确比例，**不承诺无法保证的准确率**；说清哪类处理得好、哪类易错；明确是辅助工具、关键结果须人工确认；说明后续改进方式，给合理预期。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"演示评估：测试集抽检加指标","full":[{"h":"(1) 准备演示与评估材料","c":"演示不能只挑几个成功例子给人看，那样业务方一试就露。我会准备一批来自真实业务的测试样例，覆盖日常最常见的几类情况。事先和业务方确认什么样的结果算正确——这一步必须先做，否则演示完双方对准不准的理解还是不一致。然后统计正确比例并记录下来，用数据说话。同时保留失败案例，主动说明失败的原因和已知局限，不要藏着。"},{"h":"(2) 改进方向","c":"按成本从低到高来试。先改指令：把要求写得更明确、补充示例，这个改动最快也常常最有效。再补充资料：把相关文档随问题提供给模型，让它有依据可查。然后考虑换用能力更强的模型，但要同时评估成本变化。也可以拆分任务，把一个复杂要求分成几步分别处理，每步更简单效果更稳。"},{"h":"(3) 交代能力边界","c":"这一点比展示效果更重要。我会如实说明当前的正确比例，不承诺无法保证的准确率——为了让方案通过而夸大效果，后面一定会出问题。同时说清哪类问题处理得好、哪类容易出错，让业务方知道该在什么场景用、什么场景别用。明确这个应用是辅助工具，关键结果仍需人工确认。最后说明后续可以通过哪些方式继续改进，给对方一个合理的预期。"}]},{"type":"essay","n":6,"src":"技术技能2","code":"技术技能 A1","score":"8 分","title":"你在使用大模型时发现，同一个问题多问几次，答案时好时坏，有时还会出现明显错误的信息。请说明：（1）造成这种情况的常见原因；（2）你会采取哪些做法降低影响。","points":[{"h":"(1) 常见原因","c":"①生成自带**随机性**（同指令两次表述不同）；②指令不明确留多种理解；③**幻觉**（编造看似合理实则不存在的内容）；④缺背景资料、训练知识过时或不符实际；⑤对话太长、早期要求被冲掉。"},{"h":"(2) 应对做法","c":"把要求写具体（格式/字数/判断标准、列可选范围）；**把资料随指令提供**让模型基于材料作答、并要求标注依据段落；对话过长就重开一轮重述要求；底线——**关键信息（数据/时间/人名）必须人工核实**。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"输出不稳：降温加约束加校验","full":[{"h":"(1) 常见原因","c":"第一是模型生成本身带有随机性，同一条指令问两次，表述就可能不同，这是模型的固有特性。第二是指令不够明确，留下了多种理解空间，模型每次可能按不同理解作答。第三是幻觉，模型会编造看起来很合理但实际不存在的内容，比如不存在的功能、编出来的数据。第四是缺少必要的背景资料，模型只能凭训练时学到的通用知识回答，而这些知识可能过时或与我们的实际情况不符。第五是对话太长，早期提的要求被后面的内容冲掉了。"},{"h":"(2) 应对做法","c":"针对随机性和指令模糊，把要求写得更具体，明确格式、字数、判断标准，可选范围尽量列出来。针对幻觉和知识不准，最有效的办法是把资料随指令一起提供，让模型基于给定材料作答，而不是靠它自己想；同时要求它说明依据出自哪一段，方便人工核对。对话过长时重新开始一轮，把关键要求重新交代一遍。最后有一条底线：关键信息必须人工核实，尤其是数据、时间、人名这类具体内容，不能因为答得流畅就直接采信。"}]},{"type":"essay","n":7,"src":"技术技能2","code":"技术技能 A2","score":"8 分","title":"公司的产品手册有上百页，希望做一个能回答手册相关问题的助手。请说明：（1）为什么不适合把整本手册直接放进对话里；（2）你了解的解决思路是什么，大致包含哪些步骤。","points":[{"h":"(1) 不适合的原因","c":"①上百页**超出单次对话容量上限**；②内容太多淹没重点、质量下降；③每次传整本费用高、响应慢；④手册更新要整本重传、维护麻烦。"},{"h":"(2) 解决思路（检索增强 RAG）","c":"四步：①把手册**切成语义完整的小段落**并标注出处；②存入检索库；③提问时先检索最相关几段；④把检索内容随问题交给模型、要求标注来源。并明确**检索不到就如实说“未找到”、禁止凭知识编答案**（答错会误导用户）。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"长手册走RAG分片别硬塞","full":[{"h":"(1) 不适合的原因","c":"第一，单次对话能容纳的内容有上限，上百页手册很可能直接超出，塞不进去。第二，即使塞进去了，内容太多会把关键信息淹没，模型反而找不到重点，回答质量下降。第三，每次提问都要把整本手册传一遍，费用高、响应也慢，用户体验差。第四，手册更新后要整本重新传入，维护起来很麻烦。"},{"h":"(2) 解决思路（检索增强 RAG）","c":"用先检索再回答的思路，大致四步。第一步把手册切分成小段落，切的时候注意保持语义完整，不要把一句话或一条规定从中间断开，并给每段记下出自手册哪一节。第二步把这些段落存入检索库。第三步用户提问时，先从库里检索出最相关的几段内容。第四步把检索到的内容随用户的问题一起交给模型，让它依据这些内容作答，并要求标注来源段落，方便用户点开原文核对。还有一点很重要：要明确要求检索不到相关内容时如实说明手册中未找到，而不是让模型凭知识编一个答案——手册类问答答错会直接误导用户。"}]},{"type":"essay","n":8,"src":"技术技能2","code":"技术技能 A3","score":"9 分","title":"你需要把大模型能力做成一个内部同事都能用的小工具。请说明：（1）除了核心功能，还需要考虑哪些事项；（2）上线前你会做哪些检查；（3）上线后你会如何收集反馈并持续改进。","points":[{"h":"(1) 需要考虑的事项","c":"界面简单、步骤少；输入框给**提示和示例**（多数人不知怎么写）；处理中给等待提示、出错给可理解说明；**密钥等敏感配置放服务端**不暴露；记录使用量以了解成本与使用情况。"},{"h":"(2) 上线前检查","c":"典型输入试一遍确认符合预期；试**异常输入**（空/超长/无关）看是否崩溃；确认出错有明确提示；请一位**没参与开发的同事试用**（最能发现问题）。"},{"h":"(3) 收集反馈与持续改进","c":"提供便捷反馈入口；定期查使用记录找失败多的场景（多为指令没写清）；据反馈改指令或补示例；改进后**须重新验证**，避免改坏原好用的功能。"}],"opts":[],"right":"","mine":"","wrong":false,"exp":"","eye":"内部工具：权限成本日志反馈","full":[{"h":"(1) 需要考虑的事项","c":"核心功能之外，最重要的是让不熟悉技术的同事也能用起来。界面要简单，操作步骤越少越好。输入框要给提示和示例，因为大多数人的问题是不知道该怎么写，有个例子照着改就顺畅很多。处理过程中要给等待提示，让人知道在跑而不是卡住了；出错时给可理解的说明，不要甩一串报错代码。密钥这类敏感配置必须放在服务端，不能暴露给使用者。另外要对使用量做记录，便于了解成本和谁在用、用得多不多。"},{"h":"(2) 上线前检查","c":"先用典型输入试一遍，确认结果符合预期。再试异常输入：空内容、超长内容、完全无关的内容，看会不会直接崩掉。确认出错时有明确提示，而不是白屏或一直转圈。最后请一位没参与开发的同事试用一次，看他能不能在没有额外解释的情况下顺利完成操作——这一步最能发现问题，因为自己做的东西自己总觉得好用。"},{"h":"(3) 收集反馈与持续改进","c":"提供一个便捷的反馈入口，让同事遇到问题能顺手反映，而不是需要专门找人。定期查看使用记录，找出失败较多或效果不佳的场景，这些地方往往是指令没写清。根据反馈调整指令或补充示例。有一点要注意：改进后需要重新验证一遍，避免为了修某个场景把原来好用的功能改坏了。"}]}];

var PER = 20;
var cur = 'focus', page = 1, hideAns = false, showEye = false, practice = false;
function naturalOrder(){ var a=[]; for(var i=0;i<DATA.length;i++) a.push(i); return a; }
var order = naturalOrder();
var TYPES = [['focus','重点学习'],['single','单选'],['multi','多选'],['judge','判断'],['essay','简答'],['wrong','错题本']];
var TN = {focus:'重点',single:'单选',multi:'多选',judge:'判断',essay:'简答',wrong:'错题'};
var BC = {focus:' f',single:'',multi:' m',judge:' j',essay:' e',wrong:' m'};

function loadWrong(){
  try{ var s=JSON.parse(localStorage.getItem('aq_wrong')||'[]'); return (s&&s.length)?s:[]; }catch(e){ return []; }
}
function saveWrong(){ try{ localStorage.setItem('aq_wrong',JSON.stringify(wrongSet)); }catch(e){} }
var wrongSet = loadWrong();
// 首次打开：把三套卷里你做错的题（wrong=true）种子进错题本，只导入一次
if(!localStorage.getItem('aq_seeded')){
  for(var si=0;si<DATA.length;si++){
    if(DATA[si].wrong) wrongSet.push(keyOf(DATA[si]));
  }
  try{ localStorage.setItem('aq_seeded','1'); localStorage.setItem('aq_wrong',JSON.stringify(wrongSet)); }catch(e){}
}
function isWrong(d){ return wrongSet.indexOf('q'+DATA.indexOf(d)) >= 0; }
function keyOf(d){ return 'q'+DATA.indexOf(d); }

function counts(t){
  var n=0;
  for(var i=0;i<DATA.length;i++){
    if(t==='wrong'){ if(isWrong(DATA[i])) n++; }
    else if(t==='focus'){ if(DATA[i].focus) n++; }
    else if(DATA[i].type===t) n++;
  }
  return n;
}

function renderTabs(){
  var h='';
  for(var i=0;i<TYPES.length;i++){
    var t=TYPES[i][0], name=TYPES[i][1], c=counts(t);
    h += '<div class="tab'+(cur===t?' on':'')+'" data-t="'+t+'">'+name+'<span class="cnt">'+c+'</span></div>';
  }
  document.getElementById('tabs').innerHTML=h;
  var els=document.querySelectorAll('.tab');
  for(var j=0;j<els.length;j++){
    els[j].onclick=function(){ cur=this.dataset.t; page=1; renderTabs(); render(); window.scrollTo(0,0); };
  }
}

function filtered(){
  var kw=document.getElementById('kw').value.trim().toLowerCase();
  var out=[];
  for(var i=0;i<order.length;i++){
    var d=DATA[order[i]];
    if(cur==='wrong'){ if(!isWrong(d)) continue; }
    else if(cur==='focus'){ if(!d.focus) continue; }
    else if(d.type!==cur) continue;
    if(kw){
      var s=(d.title+' '+d.opts.map(function(o){return o.t;}).join(' ')+' '+d.exp+' '+(d.eye||'')+' '+(d.points?d.points.map(function(p){return p.h+p.c;}).join(' '):'')).toLowerCase();
      if(s.indexOf(kw)<0) continue;
    }
    out.push(d);
  }
  return out;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escB(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }

function findData(cardEl){
  var key=cardEl.getAttribute('data-key');
  for(var i=0;i<DATA.length;i++) if(keyOf(DATA[i])===key) return DATA[i];
  return null;
}
function showAns(cardEl){
  cardEl.classList.add('open');
  var f=cardEl.querySelector('.flipbtn');
  if(f) f.textContent='收起答案';
  var a=cardEl.querySelector('.ans');
  if(a) a.classList.add('show');
}
function judge(cardEl, vd, opts, sub, multi){
  var d=findData(cardEl);
  if(!d) return;
  var sel=[];
  for(var i=0;i<opts.length;i++) if(opts[i].classList.contains('sel')) sel.push(opts[i].getAttribute('data-k'));
  if(!sel.length){ return; }
  var right=d.right.split('').sort().join('');
  var got=sel.slice().sort().join('');
  cardEl.classList.add('done');
  if(sub) sub.disabled=true;
  for(var j=0;j<opts.length;j++){
    var k=opts[j].getAttribute('data-k');
    opts[j].classList.remove('sel');
    if(d.right.indexOf(k)>=0) opts[j].classList.add('right');
    else if(sel.indexOf(k)>=0) opts[j].classList.add('no');
  }
  var ok = (got===right);
  vd.className='verdict show '+(ok?'ok':'no');
  if(ok){
    vd.textContent='✓ 答对了';
    delWrong(cardEl);
    if(cur==='wrong'){
      setTimeout(function(){
        var c=cardEl.parentNode;
        cardEl.remove();
        if(c && !c.querySelectorAll('.card').length){
          c.innerHTML='<div class="empty">错题本空了，全做对了</div>';
        }
      },1000);
    }
  } else {
    var ansText = d.type==='judge' ? (d.right==='a'?'对':'错') : d.right.split('').join('');
    vd.textContent='✗ 答错了　正确答案：'+ansText;
    addWrong(cardEl);
  }
  showAns(cardEl);
}
function refreshTabs(){
  var els=document.querySelectorAll('.tab');
  for(var i=0;i<els.length;i++){
    var t=els[i].dataset.t;
    var c=counts(t);
    var m=els[i].querySelector('.cnt');
    if(m) m.textContent=c;
  }
}
function addWrong(cardEl){
  var d=findData(cardEl);
  if(!d) return;
  var k=keyOf(d);
  if(wrongSet.indexOf(k)<0){ wrongSet.push(k); saveWrong(); refreshTabs(); }
}
function delWrong(cardEl){
  var d=findData(cardEl);
  if(!d) return;
  var k=keyOf(d);
  var i=wrongSet.indexOf(k);
  if(i>=0){ wrongSet.splice(i,1); saveWrong(); refreshTabs(); }
}

function card(d, idx){
  var h='<div class="card" data-key="'+keyOf(d)+'">';
  h+='<div class="hd"><span class="no">'+(d.type==='essay'?('S'+d.n):((d.type==='judge'?'判':'')+d.n))+'</span>';
  h+='<span class="src">'+esc(d.src)+'</span>';
  if(d.code) h+='<span class="badge e">'+esc(d.code)+' · '+esc(d.score)+'</span>';
  else h+='<span class="badge'+BC[d.type]+'">'+TN[d.type]+'</span>';
  if(d.focus) h+='<span class="fstar">★ 重点</span>';
  h+='</div>';
  h+='<div class="q">'+esc(d.title)+'</div>';
  if(d.eye){
    h+='<div class="eyebtn" data-i="'+idx+'">看题眼</div>';
    h+='<div class="eye" id="e'+idx+'"><span class="lbl">题眼</span>'+esc(d.eye)+'</div>';
  }
  h+='<div class="flipbtn">看答案</div>';

  if(d.opts.length){
    h+='<div class="opts">';
    for(var i=0;i<d.opts.length;i++){
      var o=d.opts[i];
      var ok = (d.right.indexOf(o.k)>=0);
      h+='<div class="opt'+(ok?' ok':'')+'" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span>'+esc(o.t)+'</span></div>';
    }
    h+='</div>';
    if(d.type==='multi') h+='<div class="submitbtn">提交答案</div>';
  } else {
    h+='<div class="essayjudge"><span class="ej ok">会了</span><span class="ej no">还不会</span></div>';
  }
  h+='<div class="verdict"></div>';

  h+='<div class="ansbox">';
  h+='<div class="reveal" data-i="'+idx+'">'+(d.type==='essay'?'查看范例答案':'显示答案')+'</div>';
  if(d.opts.length){
    var rt = d.type==='judge' ? '' : d.opts.filter(function(o){return d.right.indexOf(o.k)>=0;}).map(function(o){return o.k+' '+o.t;}).join('　');
    var lab = d.right.split('').map(function(k){
      var m=d.opts.filter(function(o){return o.k===k;})[0];
      return d.type==='judge' ? (m?m.t:k) : k;
    }).join('');
    h+='<div class="ans" id="a'+idx+'"><b>答案 '+lab+'</b>　'+esc(rt)+'</div>';
  } else {
    h+='<div class="ans" id="a'+idx+'" style="color:#374151;background:#fafbfc;border-color:#e5e7eb">';
    for(var p=0;p<d.points.length;p++){
      h+='<div class="ep"><div class="h">'+esc(d.points[p].h)+'</div><div class="c">'+escB(d.points[p].c)+'</div></div>';
    }
    h+='</div>';
    if(d.full && d.full.length){
      h+='<div class="epfull"><div class="fulldl">查看完整原答案</div><div class="fullbox">';
      for(var f=0;f<d.full.length;f++){
        h+='<div class="h">'+esc(d.full[f].h)+'</div><div class="c">'+esc(d.full[f].c)+'</div>';
      }
      h+='</div></div>';
    }
  }
  if(d.exp) h+='<div class="exp"><span class="lbl">官方解析</span>'+esc(d.exp)+'</div>';
  h+='</div></div>';
  return h;
}

function render(){
  var list=filtered();
  var pages=Math.max(1,Math.ceil(list.length/PER));
  if(page>pages) page=pages;
  var st=(page-1)*PER, sub=list.slice(st,st+PER);
  var h='';
  if(!sub.length){ h='<div class="empty">没有匹配的题目</div>'; }
  for(var i=0;i<sub.length;i++) h+=card(sub[i], i);
  document.getElementById('list').innerHTML=h;

  var rv=document.querySelectorAll('.reveal');
  for(var k=0;k<rv.length;k++){
    rv[k].onclick=function(){
      var el=document.getElementById('a'+this.dataset.i);
      var on=el.classList.toggle('show');
      this.textContent = on?'隐藏答案':'显示答案';
    };
  }
  var eb=document.querySelectorAll('.eyebtn');
  for(var e2=0;e2<eb.length;e2++){
    eb[e2].onclick=function(ev){
      if(ev) ev.stopPropagation();
      var el=document.getElementById('e'+this.dataset.i);
      if(el) el.classList.toggle('show');
    };
  }
  var fb=document.querySelectorAll('.flipbtn');
  for(var f=0;f<fb.length;f++){
    fb[f].onclick=function(ev){
      if(ev) ev.stopPropagation();
      var c=this.parentNode;
      c.classList.toggle('open');
      this.textContent = c.classList.contains('open')?'收起答案':'看答案';
    };
  }
  var ef=document.querySelectorAll('.epfull');
  for(var g=0;g<ef.length;g++){
    ef[g].onclick=function(ev){
      if(ev) ev.stopPropagation();
      this.classList.toggle('open');
      var dl=this.querySelector('.fulldl');
      if(dl) dl.textContent = this.classList.contains('open')?'收起完整原答案':'查看完整原答案';
    };
  }
  if(practice){
    var cards=document.querySelectorAll('.card');
    for(var ci=0;ci<cards.length;ci++){
      (function(cardEl){
        var opts=cardEl.querySelectorAll('.opt');
        var sub=cardEl.querySelector('.submitbtn');
        var vd=cardEl.querySelector('.verdict');
        var multi = !!cardEl.querySelector('.submitbtn');
        for(var oi=0;oi<opts.length;oi++){
          opts[oi].onclick=function(ev){
            if(ev) ev.stopPropagation();
            if(cardEl.classList.contains('done')) return;
            if(multi){ this.classList.toggle('sel'); }
            else {
              for(var q=0;q<opts.length;q++) opts[q].classList.remove('sel');
              this.classList.add('sel');
              judge(cardEl, vd, opts, sub, multi);
            }
          };
        }
        if(sub){
          sub.onclick=function(ev){
            if(ev) ev.stopPropagation();
            if(cardEl.classList.contains('done')) return;
            judge(cardEl, vd, opts, sub, multi);
          };
        }
        var ej=cardEl.querySelectorAll('.essayjudge .ej');
        if(ej.length){
          for(var ei=0;ei<ej.length;ei++){
            ej[ei].onclick=function(ev){
              if(ev) ev.stopPropagation();
              if(cardEl.classList.contains('done')) return;
              var good = this.classList.contains('ok');
              cardEl.classList.add('done');
              vd.className='verdict show '+(good?'ok':'no');
              vd.textContent = good?'✓ 答对了':'✗ 答错了，看下范例答案再记一遍';
              showAns(cardEl);
              if(good){
                delWrong(cardEl);
                if(cur==='wrong'){ setTimeout(function(){ var c=cardEl.parentNode; cardEl.remove(); if(c&&!c.querySelectorAll('.card').length) c.innerHTML='<div class="empty">错题本空了，全做对了</div>'; },1000); }
              } else {
                addWrong(cardEl);
              }
            };
          }
        }
      })(cards[ci]);
    }
  }

  if(hideAns){
    var rv2=document.querySelectorAll('.reveal');
    for(var m2=0;m2<rv2.length;m2++) rv2[m2].textContent='显示答案';
  }
  if(showEye){
    var es=document.querySelectorAll('.eye');
    for(var z=0;z<es.length;z++){ es[z].classList.add('show'); }
  }
  if(document.body.classList.contains('drill')||document.body.classList.contains('noans')){
    var cs=document.querySelectorAll('.card');
    for(var c2=0;c2<cs.length;c2++){
      cs[c2].onclick=function(){
        this.classList.toggle('open');
        var f=this.querySelector('.flipbtn');
        if(f) f.textContent = this.classList.contains('open')?'收起答案':'看答案';
      };
    }
  }

  var ph='';
  ph+='<div class="pg'+(page===1?' dis':'')+'" id="prev">‹</div>';
  var maxbtn=11, s=Math.max(1,page-5), e=Math.min(pages,s+maxbtn-1);
  if(e-s<maxbtn-1) s=Math.max(1,e-maxbtn+1);
  for(var p=s;p<=e;p++) ph+='<div class="pg'+(p===page?' on':'')+'" data-p="'+p+'">'+p+'</div>';
  ph+='<div class="pg'+(page===pages?' dis':'')+'" id="next">›</div>';
  ph+='<span class="pginfo">共 '+list.length+' 题 / '+pages+' 页</span>';
  var pg=document.getElementById('pager');
  pg.innerHTML=ph;
  var pgs=pg.querySelectorAll('.pg[data-p]');
  for(var q=0;q<pgs.length;q++) pgs[q].onclick=function(){ page=+this.dataset.p; render(); window.scrollTo(0,0); };
  var pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(pv) pv.onclick=function(){ if(page>1){page--;render();window.scrollTo(0,0);} };
  if(nx) nx.onclick=function(){ if(page<pages){page++;render();window.scrollTo(0,0);} };
}

document.getElementById('kw').oninput=function(){ page=1; render(); };
document.getElementById('allEye').onclick=function(){
  showEye=!showEye;
  this.classList.toggle('on', showEye);
  this.textContent = showEye?'隐藏全部题眼':'显示全部题眼';
  render();
};
document.getElementById('drill').onclick=function(){
  var on=!document.body.classList.contains('drill');
  setDrill(on);
  if(on && practice) togglePrac(false);
  page=1; render();
};
document.getElementById('shuf').onclick=function(){
  var on = !this.classList.contains('on');
  if(on){
    for(var i=order.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=order[i]; order[i]=order[j]; order[j]=tmp;
    }
    this.classList.add('on');
    this.textContent='恢复顺序';
  }else{
    order=naturalOrder();
    this.classList.remove('on');
    this.textContent='打乱顺序';
  }
  page=1; render();
  window.scrollTo(0,0);
};
document.getElementById('hideAns').onclick=function(){
  var on=!document.body.classList.contains('noans');
  setHide(on);
  if(on && practice) togglePrac(false);
  render();
};
document.getElementById('prac').onclick=function(){
  togglePrac(!practice);
  render();
};
function setDrill(on){
  document.body.classList.toggle('drill', on);
  var b=document.getElementById('drill');
  b.classList.toggle('on', on);
  b.textContent = on?'退出背诵模式':'背诵模式';
}
function setHide(on){
  hideAns=on;
  document.body.classList.toggle('noans', on);
  var b=document.getElementById('hideAns');
  b.classList.toggle('on', on);
  b.textContent = on?'显示正确答案':'隐藏正确答案';
}
function togglePrac(on){
  practice=on;
  document.body.classList.toggle('practice', on);
  var b=document.getElementById('prac');
  b.classList.toggle('on', on);
  b.textContent = on?'退出做题模式':'做题模式';
  if(on){ setDrill(false); setHide(false); }
}
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft'){ var p=document.getElementById('prev'); if(p&&!p.classList.contains('dis')) p.click(); }
  if(e.key==='ArrowRight'){ var n=document.getElementById('next'); if(n&&!n.classList.contains('dis')) n.click(); }
});

renderTabs();
render();

</script></body></html>
